name: Desktop package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build unsigned Windows installer
        run: npm run dist:desktop

      - name: Verify unpacked application
        run: npm run verify:desktop

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: BioResearch-OS-Windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
