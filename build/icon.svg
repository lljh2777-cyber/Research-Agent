<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">BioResearch OS</title>
  <desc id="description">An atom-shaped research mark on a dark rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="144" y1="112" x2="864" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142d55"/>
      <stop offset="0.54" stop-color="#0b1b36"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="orbit" x1="238" y1="216" x2="794" y2="812" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79c5ff"/>
      <stop offset="0.48" stop-color="#4f8fff"/>
      <stop offset="1" stop-color="#5ce2c1"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0" cy="0" r="1" gradientTransform="translate(478 474) rotate(47) scale(146)">
      <stop stop-color="#d7fff4"/>
      <stop offset="0.42" stop-color="#62e5c2"/>
      <stop offset="1" stop-color="#219a91"/>
    </radialGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="218" fill="url(#surface)" stroke="#3478c9" stroke-width="24"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="#4f8fff" stroke-opacity="0.12" stroke-width="18"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="52" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="324" ry="142"/>
    <ellipse cx="512" cy="512" rx="324" ry="142" transform="rotate(60 512 512)"/>
    <ellipse cx="512" cy="512" rx="324" ry="142" transform="rotate(120 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="92" fill="url(#nucleus)" stroke="#baffed" stroke-width="18"/>
  <circle cx="802" cy="512" r="42" fill="#7ac7ff" stroke="#e6f6ff" stroke-width="12"/>
  <circle cx="344" cy="258" r="42" fill="#5ce2c1" stroke="#e1fff7" stroke-width="12"/>
  <circle cx="334" cy="756" r="42" fill="#659cff" stroke="#e8f0ff" stroke-width="12"/>
</svg>
